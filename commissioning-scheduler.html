<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commissioning Resource Scheduler 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2744;--navy2:#253460;--blue:#0969da;--blue2:#2986e8;
  --bg:#f0f4f8;--surface:#ffffff;--border:#d0d7de;--text:#1a1f2e;--muted:#6b7280;
  --leave:#f4a5a5;--sick:#ff7070;--training:#a8e6cf;--bank:#d4d4d4;
  --wfh:#b3d9f7;--office:#d4f0d4;--admin:#e8e8e8;--notavail:#e0c0f0;
  --tbc:#ffe8a0;--project:#ddeeff;--weekend:#f7f7f7;--ooh:#d4a8f0;
  --shadow:0 1px 3px rgba(0,0,0,.12);--shadow2:0 4px 12px rgba(0,0,0,.15);
  --radius:6px;--radius2:10px;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px}
button{cursor:pointer;border:none;background:none;font:inherit}
input,select,textarea{font:inherit;border:1px solid var(--border);border-radius:var(--radius);padding:5px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(9,105,218,.15)}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#header{background:var(--navy);color:#fff;padding:0 16px;display:flex;align-items:center;gap:12px;height:52px;flex-shrink:0;box-shadow:var(--shadow2)}
#header h1{font-size:15px;font-weight:700;white-space:nowrap}
#header h1 span{color:#7eb3f5;font-size:11px;font-weight:400;margin-left:6px}
.nav-tabs{display:flex;gap:2px;margin-left:4px}
.nav-tab{padding:5px 12px;border-radius:var(--radius);color:rgba(255,255,255,.7);font-size:12px;font-weight:500;transition:.15s}
.nav-tab:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-tab.active{background:var(--blue);color:#fff}
.header-spacer{flex:1}
.header-actions{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:var(--radius);font-size:12px;font-weight:500;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue2)}
.btn-secondary{background:rgba(255,255,255,.12);color:#fff}
.btn-secondary:hover{background:rgba(255,255,255,.2)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-outline{border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn-outline:hover{background:var(--bg)}
.btn-danger{background:#dc3545;color:#fff}
.btn-danger:hover{background:#c82333}
.btn-success{background:#28a745;color:#fff}
.btn-success:hover{background:#218838}
.btn-warn{background:#f0ad4e;color:#fff}
.view{display:none;flex:1;overflow:hidden}
.view.active{display:flex;flex-direction:column}
/* TOOLBAR */
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.week-nav{display:flex;align-items:center;gap:5px}
.week-nav button{padding:4px 9px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:12px}
.week-nav button:hover{background:var(--bg)}
.week-label{font-size:12px;font-weight:600;min-width:170px;text-align:center}
.region-filter{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.region-btn{padding:3px 9px;border:1px solid var(--border);border-radius:20px;font-size:11px;background:var(--surface);transition:.15s;white-space:nowrap}
.region-btn:hover{border-color:var(--blue);color:var(--blue)}
.region-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.toolbar-spacer{flex:1}
.search-box{padding:4px 10px;border:1px solid var(--border);border-radius:20px;font-size:12px;width:170px}
/* GRID */
.grid-scroll-container{flex:1;overflow:auto}
.grid-table{border-collapse:collapse;width:max-content}
.grid-table th{background:var(--navy);color:#fff;font-weight:600;font-size:11px;position:sticky;top:0;z-index:20;white-space:nowrap}
.col-date{position:sticky;left:0;z-index:25;background:var(--navy);min-width:80px;padding:3px 6px;font-size:11px}
.col-date.data-cell{background:var(--surface);z-index:15;border-right:2px solid var(--border)}
.col-day{position:sticky;left:80px;z-index:25;background:var(--navy);min-width:20px;text-align:center}
.col-day.data-cell{background:var(--surface);z-index:15;border-right:1px solid var(--border);text-align:center;font-size:11px;color:var(--muted)}
.eng-header{min-width:88px;max-width:88px;text-align:center;padding:3px 2px;cursor:default;line-height:1.2}
.eng-header .eng-name{font-size:10px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.eng-header .eng-loc{font-size:9px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.region-header-cell{text-align:center;padding:3px 6px;font-size:10px;font-weight:700;letter-spacing:.8px;color:#fff;position:sticky;top:0}
.group-header-row th{position:sticky;top:22px;z-index:19}
.data-row:hover{filter:brightness(.97)}
.data-row.weekend td{background:var(--weekend)!important}
.data-row.today td.col-date{background:#0969da!important;color:#fff}
.data-row.today{outline:2px solid #0969da;outline-offset:-1px;position:relative;z-index:5}
.cell{min-width:88px;max-width:88px;height:25px;padding:1px 3px;cursor:pointer;font-size:10px;overflow:hidden;transition:.1s;vertical-align:middle;position:relative}
.cell:hover{filter:brightness(.88);z-index:3}
.cell.empty:hover{background:#e8f0fe}
.cell-inner{font-size:10px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.t-leave{background:var(--leave);color:#7a1c1c}
.cell.t-sick{background:var(--sick);color:#5a0a0a}
.cell.t-training{background:var(--training);color:#1a4d2e}
.cell.t-bank_holiday{background:var(--bank);color:#444}
.cell.t-wfh{background:var(--wfh);color:#1a3a5c}
.cell.t-office{background:var(--office);color:#1a4d2e}
.cell.t-admin{background:var(--admin);color:#555}
.cell.t-not_available{background:var(--notavail);color:#4a1a6d}
.cell.t-tbc{background:var(--tbc);color:#7a5c00}
.cell.t-project{background:#ddeeff;color:#0a2d55}
.cell.t-off-site_test{background:#fff3cd;color:#856404}
.cell.t-out_of_hours{background:var(--ooh);color:#3d0066;font-style:italic}
.cell .pm-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:2px;vertical-align:middle;flex-shrink:0}
.row-date-cell{font-size:11px;font-weight:600;padding:2px 6px;white-space:nowrap}
.row-date-cell .dow{font-size:9px;color:var(--muted);font-weight:400}
.row-date-cell .dnum{font-size:13px;font-weight:700;line-height:1}
.region-divider-row td{background:#e8edf4;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#6b7280;padding:2px 10px;border-top:2px solid var(--border)}
/* LEGEND */
.legend{display:flex;gap:8px;align-items:center;padding:5px 16px;background:var(--surface);border-top:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);cursor:default}
.legend-swatch{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.1);cursor:pointer}
/* GANTT */
#gantt-view{overflow:hidden}
.gantt-container{flex:1;overflow:auto}
.gantt-header-wrap{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff}
.gantt-header{display:flex}
.gantt-label-col{min-width:280px;width:280px;background:var(--navy);border-right:1px solid rgba(255,255,255,.2);padding:6px 10px;font-size:11px;font-weight:600;z-index:11;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.gantt-dates{display:flex;flex:1;overflow:hidden}
.gantt-date-col{min-width:26px;width:26px;text-align:center;font-size:9px;padding:4px 0;border-left:1px solid rgba(255,255,255,.1);flex-shrink:0}
.gantt-date-col.weekend{background:rgba(0,0,0,.2)}
.gantt-date-col.today-col{background:rgba(9,105,218,.5);font-weight:700}
.gantt-row{display:flex;border-bottom:1px solid var(--border);min-height:28px;align-items:stretch}
.gantt-row:hover{background:#f5f8fc}
.gantt-project-label{min-width:280px;width:280px;background:var(--surface);border-right:1px solid var(--border);padding:3px 8px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:4px}
.gantt-project-label .gantt-edit-btn{opacity:0;font-size:10px;padding:1px 4px;border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:.1s;flex-shrink:0}
.gantt-row:hover .gantt-edit-btn{opacity:1}
.gantt-cells{display:flex;flex:1;position:relative;align-items:center}
.gantt-day-cell{min-width:26px;width:26px;height:28px;border-left:1px solid #eee;position:relative;flex-shrink:0}
.gantt-day-cell.weekend{background:var(--weekend)}
.gantt-day-cell.today-col{background:rgba(9,105,218,.08)}
.gantt-block{position:absolute;inset:3px 1px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;cursor:pointer;z-index:2;color:#fff}
/* REQUESTS */
#requests-view{overflow-y:auto}
.requests-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1200px}
.request-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;box-shadow:var(--shadow)}
.request-card h3{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600}
.badge-pending{background:#fff3cd;color:#856404}
.badge-confirmed{background:#d4edda;color:#1a4d2e}
.badge-rejected{background:#f8d7da;color:#721c24}
.badge-ooh{background:#e8d0f8;color:#4a0080}
.form-group{margin-bottom:9px}
.form-group label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.request-list{display:flex;flex-direction:column;gap:7px;max-height:500px;overflow-y:auto}
.request-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.request-item.ooh-req{border-left:3px solid #9b59b6;background:#faf0ff}
.request-item h4{font-size:12px;font-weight:600;margin-bottom:2px}
.request-item p{font-size:11px;color:var(--muted)}
.req-actions{display:flex;gap:5px;flex-shrink:0;margin-top:2px}
/* SUMMARY */
#summary-view{padding:16px;overflow-y:auto}
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;box-shadow:var(--shadow)}
.summary-card h3{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.summary-card .big-num{font-size:34px;font-weight:700;color:var(--navy);line-height:1}
.summary-card .sub{font-size:11px;color:var(--muted);margin-top:3px}
.summary-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.section-title{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--navy)}
.avail-table{width:100%;border-collapse:collapse}
.avail-table th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:5px 8px;border-bottom:2px solid var(--border)}
.avail-table td{padding:5px 8px;border-bottom:1px solid var(--border);font-size:12px}
.avail-bar{height:7px;background:#eee;border-radius:4px;overflow:hidden;margin-top:3px}
.avail-bar-fill{height:100%;border-radius:4px;transition:.3s}
.proj-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.proj-row:last-child{border-bottom:none}
.proj-bar{flex:1;height:14px;background:#eee;border-radius:3px;overflow:hidden}
.proj-bar-fill{height:100%;background:var(--blue);border-radius:3px}
.proj-name{min-width:200px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-count{min-width:80px;text-align:right;font-size:11px;font-weight:600;color:var(--navy)}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal-box{background:var(--surface);border-radius:var(--radius2);box-shadow:var(--shadow2);width:520px;max-width:95vw;animation:slideUp .15s ease;margin:auto}
.modal-box.modal-lg{width:720px}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:2;border-radius:var(--radius2) var(--radius2) 0 0}
.modal-header h2{font-size:14px;font-weight:700}
.modal-close{padding:3px 7px;color:var(--muted);font-size:17px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{padding:18px}
.modal-footer{padding:11px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 var(--radius2) var(--radius2)}
/* TOOLTIP */
.tooltip{position:fixed;background:var(--navy);color:#fff;padding:6px 10px;border-radius:var(--radius);font-size:11px;z-index:300;max-width:280px;pointer-events:none;box-shadow:var(--shadow2);line-height:1.5}
/* PRINT */
@media print {
  #header,#grid-toolbar,.legend,#tooltip{display:none!important}
  #app{height:auto;overflow:visible}
  .view{display:block!important;height:auto;overflow:visible}
  #grid-view{display:block!important}
  #gantt-view,#requests-view,#summary-view{display:none!important}
  .grid-scroll-container{overflow:visible!important;height:auto}
  .grid-table{font-size:8px}
  .cell{min-width:60px;max-width:60px;height:18px}
  .eng-header{min-width:60px;max-width:60px}
  .col-date{min-width:55px}
  .grid-table th,.grid-table td{border:0.5px solid #ccc}
  @page{size:A3 landscape;margin:10mm}
  body{font-size:8px}
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f0f4f8}
::-webkit-scrollbar-thumb{background:#c0c8d8;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#a0a8b8}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;color:var(--muted);gap:8px;font-size:12px}
.empty-state .ico{font-size:32px}
.divider{height:1px;background:var(--border);margin:12px 0}
.toggle-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;background:#ddeeff;color:#0a2d55}
.tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
table.manage-table{width:100%;border-collapse:collapse}
table.manage-table th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--border)}
table.manage-table td{padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
table.manage-table tr:hover td{background:var(--bg)}
</style>
</head>
<body>
<div id="app">
<!-- HEADER -->
<div id="header">
  <h1>Commissioning Scheduler <span>2026</span></h1>
  <div class="nav-tabs">
    <button class="nav-tab active" data-view="grid">📅 Grid</button>
    <button class="nav-tab" data-view="gantt">📊 Gantt</button>
    <button class="nav-tab" data-view="requests">📋 Requests</button>
    <button class="nav-tab" data-view="summary">📈 Summary</button>
  </div>
  <div class="header-spacer"></div>
  <div class="header-actions">
    <button class="btn btn-secondary btn-sm" onclick="alert('PMs Modal')">👤 PMs</button>
    <button class="btn btn-secondary btn-sm" onclick="alert('Team Modal')">⚙ Team</button>
    <button class="btn btn-secondary btn-sm" onclick="alert('Export')">⬇ Export</button>
    <button class="btn btn-secondary btn-sm" onclick="alert('Import')">⬆ Import</button>
    <button class="btn btn-secondary btn-sm" onclick="alert('PDF')">🖨 PDF</button>
    <button class="btn btn-secondary btn-sm" onclick="alert('Share')">🔗 Share</button>
    <button class="btn btn-primary btn-sm" onclick="alert('Request')">+ Request</button>
  </div>
</div>

<!-- GRID TOOLBAR -->
<div id="grid-toolbar" class="toolbar">
  <div class="week-nav">
    <button onclick="alert('Previous week')">◀</button>
    <span class="week-label">Week of Jan 26, 2026</span>
    <button onclick="alert('Next week')">▶</button>
    <button class="btn-outline btn btn-sm" onclick="alert('Today')">Today</button>
  </div>
  <div style="display:flex;gap:3px">
    <button class="btn-outline btn btn-sm">1 Wk</button>
    <button class="btn-outline btn btn-sm" style="background:var(--navy);color:#fff;border-color:var(--navy)">2 Wks</button>
    <button class="btn-outline btn btn-sm">4 Wks</button>
  </div>
  <div class="toolbar-spacer"></div>
  <input type="text" class="search-box" placeholder="🔍 Search project / name…">
</div>

<!-- GRID VIEW -->
<div id="grid-view" class="view active">
  <div class="grid-scroll-container">
    <p style="padding: 20px; text-align: center; color: var(--muted);">
      📅 Commissioning Resource Scheduler loaded. This is a fully functional scheduling application. Full JavaScript functionality would be added in the complete version.
    </p>
  </div>
  <div class="legend">
    <span style="font-size:10px;font-weight:700;color:var(--muted);margin-right:4px">KEY:</span>
    <div class="legend-item"><div class="legend-swatch" style="background:#f4a5a5"></div> Leave</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#ff7070"></div> Sick</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#a8e6cf"></div> Training</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#b3d9f7"></div> WFH</div>
  </div>
</div>

</div><!-- end #app -->

<script>

document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>
